# CubeCOS overrides for the rabbitmq-server unit the rpm ships.
#
# We used to carry a whole copy of the unit and install it over the rpm's. The
# unit is not %config, so a `dnf upgrade rabbitmq-server` just overwrites it and
# silently took every setting below with it -- fine on a fresh build, where
# rootfs_install runs after the install, but wrong for an in-place upgrade. The
# four deltas below are the only reason the file was ever replaced; everything
# else in it now matches what the rpm ships.

[Unit]
# core/rabbitmq/epmd@.socket is ours: neither the erlang 24 nor the erlang 25
# monolithic rpm ships an epmd unit, so the rpm's unit cannot order against it
After=epmd@0.0.0.0.socket
Wants=epmd@0.0.0.0.socket

[Service]
# the rpm ships Restart=on-failure. Cube's cluster check and auto-repair own
# broker restarts, and a systemd restart loop hides a node that wants repairing
Restart=no

# a wedged start blocks the whole bootstrap commit; 300s is rabbit's own ceiling
# for waiting on peer tables (mnesia retry_timeout 30s x retry_limit 10)
TimeoutStartSec=300

# the rpm ships 32768 and its own comment names a drop-in as the way to raise it
LimitNOFILE=65536
