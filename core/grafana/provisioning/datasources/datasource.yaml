apiVersion: 1

datasources:
- name: influxdb-telegraf
  type: influxdb
  access: proxy
  database: telegraf
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

- name: influxdb-ceph
  type: influxdb
  access: proxy
  database: ceph
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

- name: influxdb-monasca
  type: influxdb
  access: proxy
  database: monasca
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

- name: influxdb-monasca-flux
  type: influxdb
  access: proxy
  url: http://localhost:8086
  jsonData:
    defaultBucket: monasca/def
    httpMode: POST
    organization: cube
    version: Flux
  secureJsonData:
    token: cube
  editable: true

- name: influxdb-events
  type: influxdb
  access: proxy
  database: events
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

# Through the node's own haproxy rather than straight at :9091, so this follows whatever
# /prometheus is wired to: the local Prometheus on a single node, and the deduplicating
# thanos queriers in HA. Also means a dead local querier fails over with the route
# instead of blanking this datasource.
- name: Dashboard1
  type: prometheus
  access: proxy
  database:
  url: http://localhost/prometheus
  jsonData:
     timeInterval: "1m"
  editable: true
