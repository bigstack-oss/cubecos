apiVersion: 1

# The ceph metrics this pointed at now come from the mgr's own prometheus module through
# Dashboard1, and nothing writes the influx ceph database any more, so a datasource left
# here would only ever serve data frozen at the upgrade. Listed for deletion rather than
# just removed: dropping an entry from this file leaves the row in Grafana's own database
# on an already-provisioned cluster, so an upgraded appliance would keep showing it.
deleteDatasources:
  - name: influxdb-ceph
    orgId: 1

datasources:
- name: influxdb-telegraf
  type: influxdb
  access: proxy
  database: telegraf
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

- name: influxdb-monasca
  type: influxdb
  access: proxy
  database: monasca
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

- name: influxdb-monasca-flux
  type: influxdb
  access: proxy
  url: http://localhost:8086
  jsonData:
    defaultBucket: monasca/def
    httpMode: POST
    organization: cube
    version: Flux
  secureJsonData:
    token: cube
  editable: true

- name: influxdb-events
  type: influxdb
  access: proxy
  database: events
  url: http://localhost:8086
  jsonData:
     timeInterval: "1m"
  editable: true

# Through the node's own haproxy rather than straight at :9091, so this follows whatever
# /prometheus is wired to: the local Prometheus on a single node, and the deduplicating
# thanos queriers in HA. Also means a dead local querier fails over with the route
# instead of blanking this datasource.
- name: Dashboard1
  type: prometheus
  access: proxy
  # Pinned rather than left to Grafana. Grafana derives a uid from the datasource name when
  # one is not given, which is why dashboards in this tree can hardcode uids at all -- but
  # that derivation is not a documented contract, and a dashboard that references a uid
  # needs it to be the same on every install. This is the value Grafana was already
  # assigning, so pinning it changes nothing on an existing cluster and stops being luck on
  # a new one. Referencing by name instead is not an option: Grafana 12 resolves a name only
  # through the frontend's schema migration, and /api/ds/query rejects it outright with
  # "Data source not found" -- verified against every datasource here, including the influxdb
  # ones the other dashboards still name.
  uid: P43CA22E17D0F9596
  database:
  url: http://localhost/prometheus
  jsonData:
     timeInterval: "1m"
  editable: true
