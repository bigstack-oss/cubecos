# Never start this image's central while this node runs the previous one carried across
# a hop that moves OVN (see /usr/sbin/cube-ovndb-servers): its northd would attach to the
# same local sockets and write the newer logical flows into the older southbound, which
# the older chassis cannot parse. config_neutron already skips the unit then; this is the
# backstop for any other caller. Only while the image carries that central: without one
# there is nothing to protect. 23.03 is sdk_ovn.sh's OVN_COMPAT_VER: re-point both together.
[Service]
ExecStartPre=/bin/sh -c '! { test -e /etc/ovn/compat-23.03/ovnnb_db.db && test -x /opt/ovn-23.03/share/ovn/scripts/ovn-ctl ; }'
