# Never start the 24.03 central while this node runs the 23.03 one for the
# 3.1.10 -> 3.1.20 roll (see /usr/sbin/cube-ovndb-servers): its northd would attach to
# the same local sockets and write 24.03 logical flows into the 23.03 southbound, which
# the 23.03 chassis cannot parse. config_neutron already skips the unit then; this is the
# backstop for any other caller.
[Service]
ExecStartPre=/bin/sh -c '! test -e /etc/ovn/compat-23.03/ovnnb_db.db'
