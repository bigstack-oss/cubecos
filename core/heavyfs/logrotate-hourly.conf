# Run logrotate hourly instead of daily.
#
# Every logrotate config CubeCOS generates sets `maxsize 128M` (see
# WriteLogRotateConf in hex), but maxsize is only evaluated *when logrotate
# runs*. The packaged timer is OnCalendar=daily, so a busy log grows unchecked
# overnight and is then rotated exactly once -- the 128M cap never bites.
# Measured on accept-3cc: logstash.log.1 reached 1.4G under a 128M cap, and
# /var/log alone held 6.1G with ceph warning "mon cc2 is low on available
# space" on an 88G root partition shared with the OS and the metric stores.
#
# Hourly makes the size cap mean what it says. The cost is 24 logrotate runs a
# day instead of one; each took ~42s of CPU on a loaded 3-node cluster, and
# nearly all of that was compression that has to happen either way.
#
# The empty OnCalendar= is required: drop-ins accumulate list-valued settings,
# so without the reset this would schedule daily *and* hourly.
[Timer]
OnCalendar=
OnCalendar=hourly
