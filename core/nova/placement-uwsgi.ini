[uwsgi]
# Use the placement-api WSGI script provided by the package
wsgi-file = /usr/bin/placement-api

# Run the uWSGI worker processes as the placement user
uid = placement
gid = placement

# Bind to a UNIX socket instead of a TCP port
http-socket = /var/lib/placement/placement.socket

# Grant read/write permissions to the socket
chmod-socket = 660

# Process management
master = true
processes = 4
threads = 2

# Exit cleanly
die-on-term = true

# Send uWSGI logs to the specified file
logto = /var/log/placement/placement-api.log

# OpenStack environment variables
env = OS_PLACEMENT_CONFIG_DIR=/etc/placement

# Virtual environment path
home = /opt/openstack-caracal

# uWSGI's default 4096-byte request buffer is too small for the traits query nova's
# resource tracker sends. Every sync issues one
# GET /traits?name=in:<every trait the compute reports>, and os-traits 3.0.0 plus
# nova 29.4.0 push that past 4096 once the whole request block is counted -- the URL
# is ~2.7 KB and Apache forwards 40 CGI vars on top, measured at 4130 bytes. uWSGI
# answers an oversized block by logging "unable to add HTTP_X_FORWARDED_SERVER...
# consider increasing buffer size" and closing the connection with no error of its
# own, so Apache returns 502 Proxy Error and the resource tracker dies with
# TraitRetrievalFailed on every cycle. Inventory then freezes and the scheduler
# answers "Exhausted all hosts available for retrying build failures" for a host that
# is perfectly healthy. 65535 is uWSGI's ceiling -- the packet length field is 16-bit.
buffer-size = 65535
