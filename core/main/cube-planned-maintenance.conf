# Gate for the health monitors that trigger destructive recovery. The unit
# refuses to start and keeps retrying while a planned shutdown is in progress,
# or until this node and the master finished booting (a cold boot must not fail
# over amphorae or evacuate VMs before compute is back).
#
# StartLimitIntervalSec=0 is load-bearing: without it systemd rate-limits the
# retries and parks the unit in failed state for good.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/test ! -e /etc/appliance/state/cube_planned_maintenance
ExecStartPre=+/usr/sbin/hex_sdk cube_failover_gate_open
Restart=on-failure
RestartSec=30
