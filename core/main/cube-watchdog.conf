# CubeCOS watchdog hardening (pairs with the multipath fast_io_fail fix).
# RebootWatchdogSec: hardware-watchdog force-reset if a reboot stalls (e.g. a
#   hung device teardown) -- well under systemd's 10min default.
# RuntimeWatchdogSec: reset the node if PID 1 (systemd) itself hangs.
[Manager]
RebootWatchdogSec=2min
RuntimeWatchdogSec=60
