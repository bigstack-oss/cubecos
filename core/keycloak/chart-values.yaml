image:
  repository: localhost:5080/bigstack/keycloak
  tag: 17.2.0

replicas: 1

ingress:
  enabled: true
  rules:
    - host: ""
      paths:
        - path: /auth
          pathType: Prefix

postgresql:
  enabled: false

extraEnv: |
  - name: DB_VENDOR
    value: mariadb
  - name: DB_ADDR
    value: cube-controller.default
  - name: DB_PORT
    value: "3306"
  - name: DB_DATABASE
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-database
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-user
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-password
  - name: KEYCLOAK_USER
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: keycloak-user
  - name: KEYCLOAK_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: keycloak-password
  - name: KEYCLOAK_DEFAULT_THEME
    value: cos-ui
  - name: PROXY_ADDRESS_FORWARDING
    value: "true"
  - name: JGROUPS_DISCOVERY_PROTOCOL
    value: kubernetes.KUBE_PING
  - name: KUBERNETES_NAMESPACE
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.namespace
  - name: CACHE_OWNERS_COUNT
    value: "3"
  - name: CACHE_OWNERS_AUTH_SESSIONS_COUNT
    value: "3"
  - name: LOGIN_GREETING
    value:

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
