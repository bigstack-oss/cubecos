image:
  repository: localhost:5080/bigstack/keycloak
  tag: 26.0.0

replicas: 1

# The Keycloak container entrypoint is kc.sh with no default command, so the start
# command has to be spelled out. TLS is terminated by the k3s ingress.
#
# hostname-strict=false only matters while cubeController is unset: KC_HOSTNAME below is
# emitted only when config_keycloak.cpp passes the controller address, and a strict server
# with no hostname refuses to start. Once a hostname is set Keycloak ignores the flag.
# hostname-strict-https went with the rest of hostname v1 in 26, which only warns about
# a v1 option it finds and then ignores it.
command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --http-enabled=true
  - --http-port=8080
  - --hostname-strict=false

# Keycloak 18 drops the /auth context that the WildFly distribution served everything
# under, but keystone's cube_idp remote-id, the ceph dashboard, rancher and the SAML
# metadata already persisted in /etc/keycloak all still expect it. Pinning it here keeps
# every existing SAML client valid. This is also baked into the image at build time
# because Quarkus fixes quarkus.http.root-path at augmentation.
http:
  relativePath: /auth

ingress:
  enabled: true
  rules:
    - host: ""
      paths:
        - path: /auth
          pathType: Prefix

# Credentials stay in the keycloak-db-secret that config_keycloak.cpp creates from
# /opt/keycloak/db, so only the non-secret coordinates are set here.
database:
  vendor: mariadb
  hostname: cube-controller.default
  port: 3306

# Emits KC_PROXY_HEADERS. ingress-nginx sends X-Forwarded-*, not the RFC 7239 Forwarded
# header the chart defaults to, so name it -- with the wrong one Keycloak sees plain http
# from the ingress pod. The proxy option this used to set (mode: edge) went with hostname
# v1 in 26.
proxy:
  enabled: true
  mode: xforwarded

# Emits KC_CACHE=ispn and KC_CACHE_STACK=jdbc-ping. 26 deprecates the kubernetes stack
# (JGroups DNS_PING against the headless service) for jdbc-ping, which finds peers through
# a table in the keycloak database, so nothing has to supply jgroups.dns.query any more.
cache:
  stack: default

# The chart's liveness and readiness probes already GET /auth/health/live and
# /auth/health/ready, on the management port that 26 serves health from. Only the startup
# probe is overridden. 26 opens its endpoints while it bootstraps, schema migration
# included, and only readiness waits for that to finish ("Keycloak Initialized"). The
# chart's startup probe GETs the aggregate /health, so a migration that outlasted its five
# minutes would get the pod killed part way through. Liveness stays up while the migration
# runs, so probe that instead, and keep the old 10 minute allowance for a slow node.
startupProbe: |
  httpGet:
    path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health/live'
    port: '{{ .Values.http.internalPort }}'
    scheme: '{{ .Values.http.internalScheme }}'
  initialDelaySeconds: 15
  timeoutSeconds: 1
  failureThreshold: 120
  periodSeconds: 5

extraEnv: |
  # Re-assert a build-time option the image already bakes, or the server throws it away.
  #
  # cube-cos-login.spec runs `kc.sh build --transaction-xa-enabled=false` because MariaDB
  # refuses XA whenever wsrep is on ("This version of MariaDB doesn't yet support 'XA
  # transactions with Galera replication'"), which aborts keycloak's first bootstrap
  # midway and leaves the realm half-migrated. That build is correct -- but on start
  # keycloak compares its baked build config against env plus defaults, and every other
  # baked option is mirrored below or by config_keycloak (db, cache, health, metrics,
  # http-relative-path). transaction-xa-enabled was the only one that was not, so the
  # server saw baked=false vs default=xa, decided the image was stale, re-augmented, and
  # the rebuild reset it to the default:
  #   Changes detected in configuration. Updating the server image.
  #     - transaction-xa-enabled=false > transaction-xa-enabled=xa
  # Asserting it here makes current == baked, so no pod re-augments and the value holds.
  # Observed on cube4510 after the 3.1.10 -> 3.1.20 upgrade: keycloak's admin API rejected
  # every call, cube-cos-api could not init OIDC, and cluster check reported ApiService NG.
  # 26 flipped the default to false, so baked, default and this now all agree; it stays so
  # that the value never again rests on a default.
  - name: KC_TRANSACTION_XA_ENABLED
    value: "false"
  {{- if .Values.cubeController }}
  # Keycloak is reached on K3S_INGRESS_HTTPS_PORT (10443), but ingress-nginx terminates TLS
  # on 443 inside its pod and says so in X-Forwarded-Port, so a Keycloak that resolves its
  # URLs from the request leaves the port out of everything it advertises. The SAML
  # entityID and the OIDC issuer then become https://<vip>/auth/realms/master, which matches
  # neither keystone's cube_idp remote-id nor any redirect URI already registered against
  # the SAML clients. 18 and 22 pinned the port alone with hostname-port, plus the admin
  # console URL -- which Keycloak resolves separately -- with hostname-admin. Hostname v2
  # in 26 dropped hostname-port and only warns when it is still set, so the frontend URL is
  # pinned whole instead, and the admin console follows it while hostname-admin is unset.
  # cubeController is passed in by config_keycloak.cpp with --set, the same way replicas is.
  - name: KC_HOSTNAME
    value: https://{{ .Values.cubeController }}:10443/auth
  {{- end }}
  - name: KC_DB_URL_DATABASE
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-database
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-user
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-password
  # The admin account a new master realm is created with. 26 renamed these from
  # KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD, and still reads the old names but logs each
  # use as deprecated. Either pair acts only when the master realm is first created, so an
  # upgraded realm keeps the admin it already has.
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: keycloak-user
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: keycloak-password
  # 26's kc.sh sizes the heap from the container's memory when it runs in a container:
  # -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50. These pods carry no memory limit,
  # so the JVM takes that to mean the whole node -- on a 32 GB control node a 22 GB ceiling
  # and a 16 GB initial heap, on nodes that already run near kubelet's memory-pressure line.
  # 22 started with -Xms64m -Xmx512m, which is also what kc.sh still uses outside a
  # container; keep that.
  - name: JAVA_OPTS_KC_HEAP
    value: -Xms64m -Xmx512m
  - name: LOGIN_GREETING
    value:

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
