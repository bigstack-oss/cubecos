# Keep the two operational properties the retired prometheus2 unit had and EPEL's does not.
#
# Restart=always: EPEL ships Restart=on-failure, under which a clean exit (anything that
# stops prometheus with a TERM and a zero status) leaves the node with no metrics collection
# and nothing to bring it back. prometheus2 had Restart=always; a packaging swap is not the
# place to quietly change that.
#
# LimitNOFILE: prometheus holds an fd per TSDB block and per live scrape connection. EPEL's
# unit sets no limit, so it inherits systemd's 1024 soft default; prometheus2 raised it to
# 65536. Kept at 65536 so the exporter fan-out the telemetry work adds has headroom.
[Service]
Restart=always
RestartSec=5s
LimitNOFILE=65536
