[DEFAULT]
name = monasca_api

[pipeline:main]
pipeline = request_id auth api

[app:api]
paste.app_factory = monasca_api.api.server:launch

[filter:auth]
paste.filter_factory = monasca_api.healthcheck.keystone_protocol:filter_factory

[filter:request_id]
paste.filter_factory = oslo_middleware.request_id:RequestId.factory

# NOTE: no [server:main] here. monasca-api is started as
# "gunicorn -c /etc/monasca/gunicorn-config.py --paste <this file>", and --paste
# only loads the application; a [server:main] section would be silently ignored,
# leaving gunicorn on its 127.0.0.1:8000 default. The server settings live in
# gunicorn-config.py.