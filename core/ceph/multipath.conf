# device-mapper-multipath configuration file

# For a complete list of the default configuration values, run either:
# # multipath -t
# or
# # multipathd show config

# For a list of configuration options with descriptions, see the
# multipath.conf man page.

# set user_friendly_names to no to ensure we have /dev/mapper/[WWID] form
# in case /dev/mapper/mpatha referring to different volumes between reboots

defaults {
    user_friendly_names no
    find_multipaths on
}

# Keep a down/flapping external SAN from hanging udev / ceph OSD activation / boot.
# no_path_retry fail: when ALL paths to a map are down, fail I/O immediately instead
#   of queueing forever (the COMPELNT built-in default is "queue", which hangs the
#   boot at the ceph_osd_*/partition-enumeration steps). "fail" keeps ceph bootstrap
#   time PREDICTABLE -- each down map fails fast (bounded by fast_io_fail), regardless
#   of how many SAN maps are down; a finite retry would make boot time vary with the
#   dead-map count. All-paths-down is a real outage (a normal controller failover
#   keeps the other controller's paths up), so failing fast is correct.
# fast_io_fail_tmo: fail I/O on a dead PATH fast (path level).
# san_path_err_*: shun a chronically-flapping path so udev stops re-probing it.
# Global override = highest precedence: applies to every backend regardless of
# vendor profile or operator-uploaded model.
overrides {
    no_path_retry fail
    fast_io_fail_tmo 5
    san_path_err_threshold 5
    san_path_err_forget_rate 30
    san_path_err_recovery_time 300
}

blacklist {
}
