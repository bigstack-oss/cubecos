# Bound mariadb's stop and let systemd enforce it.
#
# MariaDB.org's unit ships TimeoutStopSec=15min with SendSIGKILL=no. Together those mean
# that if mariadbd ever hangs on stop, systemd waits a quarter of an hour and then gives
# up *without* killing it -- so a reboot carries on with mariadbd still running and
# writing, and the process is cut off only when the system itself goes down. That is an
# unclean stop with no shutdown record in the error log, which is exactly the state the
# 3.1.0 node was in before its tablespaces came back unreadable (cubecos#614).
#
# Killing it instead keeps the failure inside InnoDB's own recovery contract: SIGKILL
# lands while the filesystem is still writable and the redo log is complete, so the next
# start replays it. Waiting a quarter of an hour and then losing the process to the
# reboot does not.
#
# 60s is well clear of a healthy shutdown -- the buffer pool is 122M and a normal stop
# takes about a second -- while staying under the 90s DefaultTimeoutStopSec that
# core/heavyfs/Makefile sets for everything else.
[Service]
TimeoutStopSec=60
SendSIGKILL=yes
