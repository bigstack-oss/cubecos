# Keep retrying until kafka is reachable instead of tripping the start-limit when
# telegraf boots before kafka. Type=simple so the node_start commit isn't blocked.
# See kb/cubecos/known-issues/telegraf-crashloop-kafka-not-ready.md.
#
# Type=simple is spelled out because it used to come for free: 1.17.2's packaged unit set
# no Type at all, so it defaulted to simple, and the known issue's fix rests on that --
# telegraf is started synchronously inside the node_start commit, and simple lets
# `systemctl restart` return immediately while the retries happen in the background.
# 1.24.4 ships Type=notify, under which that same restart waits for a readiness
# notification telegraf does not send until its outputs are up -- i.e. exactly the boot
# commit stall the drop-in exists to avoid, on exactly the kafka-not-ready path.
[Unit]
StartLimitIntervalSec=0
[Service]
Type=simple
RestartSec=15
