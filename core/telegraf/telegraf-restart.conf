# Keep retrying until kafka is reachable instead of tripping the start-limit when
# telegraf boots before kafka. Type=simple so the node_start commit isn't blocked.
# See kb/cubecos/known-issues/telegraf-crashloop-kafka-not-ready.md.
#
# Type=simple is spelled out because it used to come for free: 1.17.2's packaged unit set
# no Type at all, so it defaulted to simple, and the known issue's fix rests on that --
# telegraf is started synchronously inside the node_start commit, and simple lets
# `systemctl restart` return immediately while the retries happen in the background.
# 1.24 started shipping Type=notify, under which that same restart waits for a readiness
# notification telegraf does not send until its outputs are up -- i.e. exactly the boot
# commit stall the drop-in exists to avoid, on exactly the kafka-not-ready path. 1.30.3
# added NotifyAccess=all and 1.40.1 ships that unit unchanged, so the override is still
# load-bearing.
#
# The rest of what 1.30.3 added to the packaged unit is deliberately left alone:
# KillMode=mixed, LimitMEMLOCK=8M:8M and PrivateMounts=true. PrivateMounts gives the unit
# its own mount namespace with slave propagation, so host mounts made after telegraf starts
# are still visible to it -- re-verified on cc1 at 1.40.1 that every exec plugin, the ceph
# admin sockets under /var/run/ceph and the sudo hex_sdk calls keep working under it.
#
# Upstream now has its own answer to the kafka-not-ready start: at 1.40.1 outputs.kafka
# honours startup_error_behavior = "retry" (at 1.30.3 it was rejected as unknown), and on
# cc1 the agent then stays up with the broker down and retries the connection on every
# flush. Adopting it changes how a node boots, so it is left to its own change.
[Unit]
StartLimitIntervalSec=0
[Service]
Type=simple
RestartSec=15
# 1.40 waits for in-flight exec gathers (up to 10m) on stop; don't let a restart block on them
TimeoutStopSec=10s
