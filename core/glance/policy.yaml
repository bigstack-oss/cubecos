"add_image": "role:admin or role:service or (role:member and project_id:%(project_id)s and project_id:%(owner)s)"
"delete_image": "role:admin or role:service or (role:member and project_id:%(project_id)s)"
"get_image": "role:admin or role:service or (role:reader and (project_id:%(project_id)s or project_id:%(member_id)s or 'community':%(visibility)s or 'public':%(visibility)s or 'shared':%(visibility)s))"
"get_images": "role:admin or role:service or (role:reader and project_id:%(project_id)s)"
"modify_image": "role:admin or role:service or (role:member and project_id:%(project_id)s)"
"download_image": "role:admin or role:service or (role:member and (project_id:%(project_id)s or project_id:%(member_id)s or 'community':%(visibility)s or 'public':%(visibility)s or 'shared':%(visibility)s))"
"upload_image": "role:admin or role:service or (role:member and project_id:%(project_id)s)"
"delete_image_location": "role:admin or role:service"
"get_image_location": "role:admin or role:service or (role:reader and project_id:%(project_id)s)"
"set_image_location": "role:admin or role:service or (role:member and project_id:%(project_id)s)"
"copy_image": "role:admin or role:service"
