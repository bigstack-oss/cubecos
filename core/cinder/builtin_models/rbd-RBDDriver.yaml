driver: "cinder.volume.drivers.rbd.RBDDriver"
vendor: "Generic"
type: "Ceph"
# RBD is a network disk: no multipath.
multipath: []
storage:
  service:
    driverSection:
      # ship ceph.conf via extraConfigFiles; it lands as <storage_name>_ceph.conf
      - key: "rbd_ceph_conf"
        value: "/etc/cinder/external_storage_extra_configs/<storage_name>_ceph.conf"
      - key: "rbd_pool"
        value: "<pool on that cluster>"
      # add rbd_user only for a cephx cluster (needs a uniquely named libvirt secret)
      - key: "rados_connect_timeout"
        value: "-1"
      - key: "rbd_flatten_volume_from_snapshot"
        value: "false"
      - key: "rbd_max_clone_depth"
        value: "5"
      - key: "rbd_store_chunk_size"
        value: "4"
    extraSettings: []
    extraConfigFiles: []
  volumeType:
    settings:
      - key: "multiattach"
        value: ""
  image:
    useMultipath: false
    forceMultipath: false
