driver: "cinder.volume.drivers.fujitsu.eternus_dx.eternus_dx_fc.FJDXFCDriver"
vendor: "Fujitsu"
type: "ETERNUS DX S3 Series FC"
multipath:
  - section: "devices"
    attributes: []
    subSections:
      - section: "device"
        attributes:
          - key: "vendor"
            value: "FUJITSU"
          - key: "product"
            value: "ETERNUS_DXL"
          - key: "user_friendly_names"
            value: "no"
storage:
  service:
    driverSection:
      - key: "cinder_eternus_config_file"
        value: "/etc/cinder/external_storage_extra_configs/<storage_name>_eternus_dx_fc.xml"
      # Epoxy's driver logs into the ETERNUS CLI with an SSH key unless told
      # otherwise -- fujitsu_passwordless is new in 2025.1 and defaults to True --
      # but this model authenticates with the EternusUser and EternusPassword of
      # the XML file above and provisions no key, so it keeps the password login
      # upstream's upgrade note asks existing users to pin.
      - key: "fujitsu_passwordless"
        value: "False"
    extraSettings: []
    extraConfigFiles:
      - name: "eternus_dx_fc.xml"
        content: ""
  volumeType:
    settings: []
  image:
    useMultipath: true
    forceMultipath: true
