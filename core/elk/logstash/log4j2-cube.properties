# CubeCOS additions, appended to the log4j2.properties the logstash tarball ships.
# Kept as a separate file rather than a full replacement so a logstash version bump
# brings upstream's own changes with it and only these lines are ours. The upstream
# file is preserved beside it as log4j2.properties.orig, matching logstash.yml.
#
# Later definitions of the same logger key win in log4j2, so appending is enough.

# The opensearch output logs one INFO line PER RETRIED DOCUMENT, and each line
# carries the whole document -- so a period of OpenSearch backpressure does not
# produce a few hundred lines, it produces gigabytes. Measured on accept-3cc: a
# single logstash.log generation reached 1.4G and was 100% this one message,
#   "Retrying failed action {status: 429, action: [\"index\", {...whole doc...}]}"
# at ~60k lines an hour. status 429 is OpenSearch rejecting the bulk write.
#
# WARN is the right floor rather than a silencing, because the condition this
# hides is still reported: the plugin logs the connection loss itself at ERROR
# ("no living connections in the pool") and the recovery at WARN ("Restored
# connection to OpenSearch instance"). What goes away is the per-document retry
# line, which is not individually actionable -- the aggregate is what an operator
# needs, and 429 backpressure is visible in OpenSearch's own metrics too.
logger.cube_opensearch_output.name = logstash.outputs.opensearch
logger.cube_opensearch_output.level = warn

# The Kafka consumer client logs group join/rebalance/heartbeat detail at INFO for
# every consumer group, and the pipeline runs ten of them (log-transformer,
# auditlog-transformer, the four *-event-mappers and the four telegraf persisters).
# On a restart that is the majority of what logstash.log contains -- 2080 of 5261
# lines on accept-3cc were ConsumerCoordinator alone.
#
# Same shape as the org.apache.http logger upstream already pins to fatal in the
# file this appends to.
logger.cube_kafka_coordinator.name = org.apache.kafka.clients.consumer.internals.ConsumerCoordinator
logger.cube_kafka_coordinator.level = warn
logger.cube_kafka_rebalance.name = org.apache.kafka.clients.consumer.internals.ConsumerRebalanceListenerInvoker
logger.cube_kafka_rebalance.level = warn
