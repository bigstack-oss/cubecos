generator_options:
  config_dir: []
  config_file:
  - /tmp/ksgen/config-generator.conf
  config_source: []
  format_: yaml
  minimal: false
  namespace:
  - keystone
  - oslo.cache
  - oslo.log
  - oslo.messaging
  - oslo.policy
  - oslo.db
  - oslo.middleware
  - osprofiler
  output_file: /tmp/ksgen/keystone-schema.yaml
  summarize: false
  wrap_width: 79
